name: SDK validation

'on':
  pull_request:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: SDK / macOS and iOS 16
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcrun xcodebuild -version
          xcrun swift --version
      - name: Validate SDK package, tests, release and iOS
        run: ./script/verify.sh --ios
